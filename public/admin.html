<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | SpMNDaGourmet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">SpMNDaGourmet</a>
    <nav>
      <a href="/">Order</a>
      <a href="/lookup.html">Find order</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <main class="page">
    <section class="hero">
      <p class="eyebrow">Private area</p>
      <h1>Admin orders</h1>
      <p>Log in with your admin username and password.</p>
    </section>

    <section id="loginCard" class="card narrow-card">
      <form id="loginForm">
        <label class="field">
          <span>Admin username</span>
          <input id="adminUsername" type="text" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Admin password</span>
          <input id="adminPassword" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary" type="submit">Log in</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="admin-actions">
        <span id="signedInAs" class="signed-in"></span>
        <button id="refreshButton" class="secondary">Refresh</button>
        <button id="logoutButton" class="danger-outline">Log out</button>
      </div>

      <div class="card table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Class</th>
                <th>Raspberry<br><small>€1.00 ea.</small></th>
                <th>Strawberry<br><small>€1.00 ea.</small></th>
                <th>Chocolate<br><small>€1.50 ea.</small></th>
                <th>Total</th>
                <th>Status</th>
                <th>Created</th>
                <th>Delete</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
        <p id="adminMessage" class="message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
