<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Order | SpMNDaGourmet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">SpMNDaGourmet</a>
    <nav>
      <a href="/">Order</a>
      <a href="/lookup.html">Find order</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <main class="page narrow">
    <section class="hero">
      <p class="eyebrow">Order lookup</p>
      <h1>Find your order</h1>
      <p>Enter the code you received after ordering.</p>
    </section>

    <section class="card">
      <form id="lookupForm" class="lookup-form">
        <label class="field">
          <span>Order code</span>
          <input id="lookupCode" type="text" placeholder="MNT-83D7A2" autocomplete="off" required />
        </label>
        <button class="primary" type="submit">Search</button>
      </form>

      <p id="lookupMessage" class="message" aria-live="polite"></p>
      <div id="orderResult" class="hidden"></div>
    </section>
  </main>

  <script src="lookup.js"></script>
</body>
</html>
